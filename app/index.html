<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>ReplyBy</title>
    <meta name="description" content="Photograph a Medi-Cal letter. See what it means, when it is due, and get your reply ready to mail." />

    <!-- Makes the app installable to the phone home screen. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1f4e8c" />

    <!-- iOS ignores most of the manifest, so it needs its own tags. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ReplyBy" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- The logo (public/logo.svg), with a picture for browsers that can't draw it. -->
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
